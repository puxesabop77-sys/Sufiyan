<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti Lodge - Availability</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:30px;
}

.logo{
    text-align:center;
}

.logo img{
    width:170px;
    border-radius:50%;
    box-shadow:0 0 30px rgba(255,255,255,.2);
}

.logo h1{
    margin-top:15px;
    font-size:2.5rem;
}

.logo p{
    color:#94a3b8;
}

.card{
    margin-top:40px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:25px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-top:20px;
}

.stat{
    background:#111827;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.stat h2{
    font-size:2rem;
}

.available{
    color:#22c55e;
}

.occupied{
    color:#ef4444;
}

.waiting{
    color:#f59e0b;
}

.status{
    margin-top:30px;
    padding:20px;
    border-radius:15px;
    background:#052e16;
    border:1px solid #22c55e;
    text-align:center;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.footer{
    margin-top:50px;
    text-align:center;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="/images/antilodge-logo.png" alt="Anti Lodge">
        <h1>ANTI LODGE</h1>
        <p>Home Away From Home</p>
    </div>

    <div class="card">

        <h2>🏠 Room Availability</h2>

        <div class="stats">

            <div class="stat">
                <h2>50</h2>
                <p>Total Beds</p>
            </div>

            <div class="stat">
                <h2 class="available">12</h2>
                <p>Available</p>
            </div>

            <div class="stat">
                <h2 class="occupied">38</h2>
                <p>Occupied</p>
            </div>

            <div class="stat">
                <h2 class="waiting">5</h2>
                <p>Waiting List</p>
            </div>

        </div>

        <div class="status">
            ✅ Rooms Available Right Now
            <br>
            Contact Admin for Instant Booking
        </div>

        <center>
            <a href="https://wa.me/91XXXXXXXXXX" class="btn">
                Book on WhatsApp
            </a>
        </center>

    </div>

    <div class="footer">
        © 2026 Anti Lodge • Fully Automated Student Support System
    </div>

</div>

</body>
  </html>
